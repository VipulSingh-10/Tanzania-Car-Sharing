server:
  port: ${PORT:8085}

spring:
  application:
    name: notification-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:localhost}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: ${PORT:8085}
    statusPageUrl: https://${eureka.instance.hostname}/actuator/info
    healthCheckUrl: https://${eureka.instance.hostname}/actuator/health
    homePageUrl: https://${eureka.instance.hostname}/

management:
  endpoints:
    web:
      exposure:
        include: health,info

firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:/etc/secrets/firebase.json}
  database:
    url: ${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}