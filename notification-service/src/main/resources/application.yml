server:
  port: 8085

spring:
  application:
    name: notification-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:classpath:firebase-sdk.json}
  database:
    url: ${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}