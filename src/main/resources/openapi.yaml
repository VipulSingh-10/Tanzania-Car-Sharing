openapi: 3.0.0
servers:
  - description: Local Development Server
    url: http://localhost:8911
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/philippsuniversity/CarSharingAPI/1.0.0
info:
  description: |
    B2B Carpooling Application API for managing user accounts, vehicles, ride offers, 
    and ride requests for a corporate carpooling solution.
  version: "1.0.0"
  title: B2B Carpooling API
  contact:
    email: your.email@university.edu
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
tags:
  - name: users
    description: User management operations
  - name: rides
    description: Operations for finding and joining rides
  - name: trips
    description: Operations for creating and managing trips
  - name: vehicles
    description: Vehicle registration and management
  - name: myrides
    description: User's upcoming and past rides
paths:
  /api/users/signup:
    post:
      tags:
        - users
      summary: Register a new user
      operationId: registerUser
      description: Creates a new user account in the system
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
            examples:
              userSignup:
                value:
                  requestContent:
                    name: "John Doe"
                    EmailId: "john.doe@company.com"
                    phone: "1234567890"
                    password: "securePassword123"
        required: true
      responses:
        '200':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              examples:
                success:
                  value:
                    status: true
                    message: "User registered successfully"
                    responseContent:
                      userId: "user123"
                      name: "John Doe"
                      email: "john.doe@company.com"
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/login:
    post:
      tags:
        - users
      summary: User login
      operationId: loginUser
      description: Authenticates a user and returns login details
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  requestContent:
                    email: "john.doe@company.com"
                    password: "securePassword123"
        required: true
      responses:
        '200':
          description: User successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    status: true
                    message: "Login successful"
                    responseContent:
                      userId: "user123"
                      name: "John Doe"
                      email: "john.doe@company.com"
                      token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/profile/{userId}:
    get:
      tags:
        - users
      summary: Get user profile
      operationId: getUserProfile
      description: Retrieves user profile information
      parameters:
        - name: userId
          in: path
          required: true
          description: User's unique identifier
          schema:
            type: string
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/vehicles/register:
    post:
      tags:
        - vehicles
      summary: Register a new vehicle
      operationId: registerVehicle
      description: Registers a new vehicle for a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRegistrationRequest'
            examples:
              vehicleReg:
                value:
                  userId: "user123"
                  requestContent:
                    regNumber: "AB12XYZ"
                    model: "Toyota Camry"
                    color: "Blue"
                    capacity: 4
        required: true
      responses:
        '200':
          description: Vehicle registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleRegistrationResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/vehicles/{userId}:
    get:
      tags:
        - vehicles
      summary: Get user vehicles
      operationId: getUserVehicles
      description: Retrieves all vehicles registered by a user
      parameters:
        - name: userId
          in: path
          required: true
          description: User's unique identifier
          schema:
            type: string
      responses:
        '200':
          description: List of user vehicles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVehiclesResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/trips/create:
    post:
      tags:
        - trips
      summary: Create a new trip
      operationId: createTrip
      description: Creates a new trip offered by a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
            examples:
              trip:
                value:
                  userId: "user123"
                  requestContent:
                    vehicleId: "vehicle456"
                    source: "Home"
                    destination: "Office"
                    date: "2025-06-15"
                    time: "09:00"
                    availableSeats: 3
                    routePoints: ["Checkpoint A", "Checkpoint B"]
        required: true
      responses:
        '200':
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTripResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rides/find:
    post:
      tags:
        - rides
      summary: Find available rides
      operationId: findRides
      description: Searches for available rides matching criteria
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindRideRequest'
            examples:
              findRide:
                value:
                  userId: "user123"
                  requestContent:
                    source: "Home"
                    destination: "Office"
                    date: "2025-06-15"
                    time: "09:00"
        required: true
      responses:
        '200':
          description: List of available rides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindRideResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rides/join:
    post:
      tags:
        - rides
      summary: Join a trip
      operationId: joinTrip
      description: Request to join an available trip
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinTripRequest'
            examples:
              join:
                value:
                  userId: "user123"
                  requestContent:
                    tripId: "trip789"
                    pickupPoint: "Checkpoint A"
        required: true
      responses:
        '200':
          description: Join request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinTripResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/myrides/trips:
    get:
      tags:
        - myrides
      summary: Get user's offered trips
      operationId: getUserTrips
      description: Retrieves all trips offered by a user
      parameters:
        - name: userId
          in: query
          required: true
          description: User's unique identifier
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by trip status (UPCOMING, COMPLETED, CANCELLED)
          schema:
            type: string
            enum: [UPCOMING, COMPLETED, CANCELLED]
      responses:
        '200':
          description: List of user's offered trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTripsResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/myrides/rides:
    get:
      tags:
        - myrides
      summary: Get user's booked rides
      operationId: getUserRides
      description: Retrieves all rides booked by a user
      parameters:
        - name: userId
          in: query
          required: true
          description: User's unique identifier
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by ride status (UPCOMING, COMPLETED, CANCELLED)
          schema:
            type: string
            enum: [UPCOMING, COMPLETED, CANCELLED]
      responses:
        '200':
          description: List of user's booked rides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRidesResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/trips/{tripId}/requests:
    get:
      tags:
        - trips
      summary: Get join requests for a trip
      operationId: getTripRequests
      description: Retrieves all pending join requests for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          description: Trip's unique identifier
          schema:
            type: string
        - name: userId
          in: query
          required: true
          description: User's unique identifier (trip owner)
          schema:
            type: string
      responses:
        '200':
          description: List of join requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRequestsResponse'
        '403':
          description: User is not the trip owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/trips/requests/{requestId}/respond:
    post:
      tags:
        - trips
      summary: Respond to a join request
      operationId: respondToJoinRequest
      description: Accept or reject a request to join a trip
      parameters:
        - name: requestId
          in: path
          required: true
          description: Join request's unique identifier
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequestResponseRequest'
            examples:
              respond:
                value:
                  userId: "user123"
                  requestContent:
                    status: "ACCEPTED"
                    message: "Welcome aboard!"
        required: true
      responses:
        '200':
          description: Response submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestResponseResponse'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # Base DTOs
    RequestDTO:
      type: object
      properties:
        userId:
          type: string
          example: "user123"
        requestContent:
          type: object
          description: "Content varies based on endpoint"

    ResponseDTO:
      type: object
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation successful"
        responseContent:
          type: object
          description: "Content varies based on endpoint"

    ErrorResponse:
      type: object
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: "Error occurred"
        errorCode:
          type: string
          example: "ERR_INVALID_INPUT"

    # User-related schemas
    UserInfoDTO:
      type: object
      required:
        - name
        - emailid
        - password
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@company.com"
        phone:
          type: string
          example: "1234567890"
        password:
          type: string
          format: password
          example: "securePassword123"

    UserSignupRequest:
      allOf:
        - $ref: '#/components/schemas/RequestDTO'
        - type: object
          properties:
            requestContent:
              $ref: '#/components/schemas/UserInfoDTO'

    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                userId:
                  type: string
                  example: "user123"
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  example: "john.doe@company.com"

    LoginRequestDTO:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john.doe@company.com"
        password:
          type: string
          format: password
          example: "securePassword123"

    LoginRequest:
      allOf:
        - $ref: '#/components/schemas/RequestDTO'
        - type: object
          properties:
            requestContent:
              $ref: '#/components/schemas/LoginRequestDTO'

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                userId:
                  type: string
                  example: "user123"
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  example: "john.doe@company.com"
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    UserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                userId:
                  type: string
                  example: "user123"
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  example: "john.doe@company.com"
                phone:
                  type: string
                  example: "1234567890"
                joinedDate:
                  type: string
                  format: date-time
                  example: "2023-01-15T10:30:00Z"
                stats:
                  type: object
                  properties:
                    tripsOffered:
                      type: integer
                      example: 15
                    ridesBooked:
                      type: integer
                      example: 7
                    rating:
                      type: number
                      format: float
                      example: 4.7

    # Vehicle-related schemas
    VehicleDTO:
      type: object
      required:
        - regNumber
        - model
        - capacity
      properties:
        regNumber:
          type: string
          example: "AB12XYZ"
        model:
          type: string
          example: "Toyota Camry"
        color:
          type: string
          example: "Blue"
        capacity:
          type: integer
          minimum: 1
          maximum: 10
          example: 4

    VehicleRegistrationRequest:
      allOf:
        - $ref: '#/components/schemas/RequestDTO'
        - type: object
          properties:
            requestContent:
              $ref: '#/components/schemas/VehicleDTO'

    VehicleRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                vehicleId:
                  type: string
                  example: "vehicle456"
                regNumber:
                  type: string
                  example: "AB12XYZ"
                model:
                  type: string
                  example: "Toyota Camry"

    UserVehiclesResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                vehicles:
                  type: array
                  items:
                    type: object
                    properties:
                      vehicleId:
                        type: string
                        example: "vehicle456"
                      regNumber:
                        type: string
                        example: "AB12XYZ"
                      model:
                        type: string
                        example: "Toyota Camry"
                      color:
                        type: string
                        example: "Blue"
                      capacity:
                        type: integer
                        example: 4

    # Trip-related schemas
    TripDTO:
      type: object
      required:
        - vehicleId
        - source
        - destination
        - date
        - time
        - availableSeats
      properties:
        vehicleId:
          type: string
          example: "vehicle456"
        source:
          type: string
          example: "Home"
        destination:
          type: string
          example: "Office"
        date:
          type: string
          format: date
          example: "2025-06-15"
        time:
          type: string
          example: "09:00"
        availableSeats:
          type: integer
          minimum: 1
          example: 3
        routePoints:
          type: array
          items:
            type: string
          example: ["Checkpoint A", "Checkpoint B"]
        additionalInfo:
          type: string
          example: "AC vehicle, no smoking"

    CreateTripRequest:
      allOf:
        - $ref: '#/components/schemas/RequestDTO'
        - type: object
          properties:
            requestContent:
              $ref: '#/components/schemas/TripDTO'

    CreateTripResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                tripId:
                  type: string
                  example: "trip789"
                source:
                  type: string
                  example: "Home"
                destination:
                  type: string
                  example: "Office"
                date:
                  type: string
                  format: date
                  example: "2025-06-15"
                time:
                  type: string
                  example: "09:00"
                availableSeats:
                  type: integer
                  example: 3
                status:
                  type: string
                  enum: [SCHEDULED, COMPLETED, CANCELLED]
                  example: "SCHEDULED"

    # Ride-related schemas
    RideSearchDTO:
      type: object
      required:
        - source
        - destination
        - date
      properties:
        source:
          type: string
          example: "Home"
        destination:
          type: string
          example: "Office"
        date:
          type: string
          format: date
          example: "2025-06-15"
        time:
          type: string
          example: "09:00"
        flexibleTiming:
          type: boolean
          example: true

    FindRideRequest:
      allOf:
        - $ref: '#/components/schemas/RequestDTO'
        - type: object
          properties:
            requestContent:
              $ref: '#/components/schemas/RideSearchDTO'

    FindRideResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                trips:
                  type: array
                  items:
                    type: object
                    properties:
                      tripId:
                        type: string
                        example: "trip789"
                      driverName:
                        type: string
                        example: "Jane Smith"
                      driverRating:
                        type: number
                        format: float
                        example: 4.8
                      vehicleModel:
                        type: string
                        example: "Toyota Camry"
                      vehicleColor:
                        type: string
                        example: "Blue"
                      source:
                        type: string
                        example: "Home"
                      destination:
                        type: string
                        example: "Office"
                      date:
                        type: string
                        format: date
                        example: "2025-06-15"
                      time:
                        type: string
                        example: "09:00"
                      availableSeats:
                        type: integer
                        example: 3
                      routePoints:
                        type: array
                        items:
                          type: string
                        example: ["Checkpoint A", "Checkpoint B"]

    JoinTripRequestDTO:
      type: object
      required:
        - tripId
      properties:
        tripId:
          type: string
          example: "trip789"
        pickupPoint:
          type: string
          example: "Checkpoint A"
        note:
          type: string
          example: "I'll be at the pickup point 5 minutes early"

    JoinTripRequest:
      allOf:
        - $ref: '#/components/schemas/RequestDTO'
        - type: object
          properties:
            requestContent:
              $ref: '#/components/schemas/JoinTripRequestDTO'

    JoinTripResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                requestId:
                  type: string
                  example: "request123"
                tripId:
                  type: string
                  example: "trip789"
                status:
                  type: string
                  enum: [PENDING, ACCEPTED, REJECTED]
                  example: "PENDING"
                message:
                  type: string
                  example: "Your request has been submitted and is pending approval"

    # My Rides schemas
    UserTripsResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                trips:
                  type: array
                  items:
                    type: object
                    properties:
                      tripId:
                        type: string
                        example: "trip789"
                      source:
                        type: string
                        example: "Home"
                      destination:
                        type: string
                        example: "Office"
                      date:
                        type: string
                        format: date
                        example: "2025-06-15"
                      time:
                        type: string
                        example: "09:00"
                      vehicleId:
                        type: string
                        example: "vehicle456"
                      vehicleModel:
                        type: string
                        example: "Toyota Camry"
                      totalSeats:
                        type: integer
                        example: 4
                      bookedSeats:
                        type: integer
                        example: 1
                      status:
                        type: string
                        enum: [UPCOMING, COMPLETED, CANCELLED]
                        example: "UPCOMING"
                      passengers:
                        type: array
                        items:
                          type: object
                          properties:
                            userId:
                              type: string
                              example: "user456"
                            name:
                              type: string
                              example: "Alice Johnson"
                            pickupPoint:
                              type: string
                              example: "Checkpoint A"

    UserRidesResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                rides:
                  type: array
                  items:
                    type: object
                    properties:
                      requestId:
                        type: string
                        example: "request123"
                      tripId:
                        type: string
                        example: "trip789"
                      driverName:
                        type: string
                        example: "Jane Smith"
                      vehicleModel:
                        type: string
                        example: "Toyota Camry"
                      vehicleColor:
                        type: string
                        example: "Blue"
                      source:
                        type: string
                        example: "Home"
                      destination:
                        type: string
                        example: "Office"
                      date:
                        type: string
                        format: date
                        example: "2025-06-15"
                      time:
                        type: string
                        example: "09:00"
                      pickupPoint:
                        type: string
                        example: "Checkpoint A"
                      status:
                        type: string
                        enum: [UPCOMING, COMPLETED, CANCELLED]
                        example: "UPCOMING"

    # Trip request management schemas
    TripRequestsResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                requests:
                  type: array
                  items:
                    type: object
                    properties:
                      requestId:
                        type: string
                        example: "request123"
                      userId:
                        type: string
                        example: "user456"
                      userName:
                        type: string
                        example: "Alice Johnson"
                      userRating:
                        type: number
                        format: float
                        example: 4.5
                      pickupPoint:
                        type: string
                        example: "Checkpoint A"
                      note:
                        type: string
                        example: "I'll be at the pickup point 5 minutes early"
                      requestTime:
                        type: string
                        format: date-time
                        example: "2025-06-14T15:30:00Z"

    JoinRequestResponseDTO:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ACCEPTED, REJECTED]
          example: "ACCEPTED"
        message:
          type: string
          example: "Welcome aboard!"

    JoinRequestResponseRequest:
      allOf:
        - $ref: '#/components/schemas/RequestDTO'
        - type: object
          properties:
            requestContent:
              $ref: '#/components/schemas/JoinRequestResponseDTO'

    JoinRequestResponseResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseDTO'
        - type: object
          properties:
            responseContent:
              type: object
              properties:
                requestId:
                  type: string
                  example: "request123"
                tripId:
                  type: string
                  example: "trip789"
                status:
                  type: string
                  enum: [ACCEPTED, REJECTED]
                  example: "ACCEPTED"
